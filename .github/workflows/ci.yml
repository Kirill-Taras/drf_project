name: Django CI/CD Pipeline

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Install Poetry
      run: pip install poetry
    - name: Install dependencies
      run: poetry install --no-root
    - name: Run Flake8
      run: poetry run flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drf_project
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Check out code
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - name: Install Poetry
      run: pip install poetry
    - name: Install dependencies
      run: poetry install --no-root
    - name: Run migrations
      env:
        DB_NAME: drf_project
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        run: |
          poetry run python manage.py migrate
      run: poetry run python manage.py migrate
    - name: Run tests
      env:
        DB_NAME: drf_project
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
      run: poetry run python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      # 1. Настройка SSH подключения
    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.4
      with:
        ssh-private-key: ${{ secrets.SSH_KEY }}
      # 2. Добавляем сервер в known_hosts
    - name: Add server to known_hosts
      run: |
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
      # 3. Копируем файлы на сервер
    - name: Copy project files to server
      run: |
       ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
         cd ${{ secrets.DEPLOY_DIR }}
         git pull
       EOF
      # 4. Устанавливаем зависимости на сервер
    - name: Install dependencies on server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          cd ${{ secrets.DEPLOY_DIR }}
          curl -sSL https://install.python-poetry.org | python3 -
          poetry install --no-root
        EOF
      # 5. Установка и настройка PostgreSQL на сервере
    - name: Setup PostgreSQL on server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
      # Принудительно останавливаем postgresql (на случай если висит)
        sudo systemctl stop postgresql || true
      
      # Убедимся что postgresql действительно установлен
        sudo apt-get install -y postgresql postgresql-contrib
      
      # Явно создаем кластер если его нет
        sudo pg_createcluster 14 main --start
      
      # Удаляем пользователя если он уже существует
        sudo -u postgres psql -c "DROP USER IF EXISTS ${{ secrets.DB_USER }};"
      
      # Создаем нового пользователя с правильными правами
        sudo -u postgres psql -c "CREATE USER ${{ secrets.DB_USER }} WITH PASSWORD '${{ secrets.DB_PASSWORD }}';"
        sudo -u postgres psql -c "CREATE DATABASE ${{ secrets.DB_NAME }} OWNER ${{ secrets.DB_USER }};"
        sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE ${{ secrets.DB_NAME }} TO ${{ secrets.DB_USER }};"
        
      # Настраиваем аутентификацию
        echo "host all all 127.0.0.1/32 md5" | sudo tee -a /etc/postgresql/*/main/pg_hba.conf
      
      # Полная перезагрузка
        sudo systemctl restart postgresql
      
      # Проверяем что пользователь создан
        sudo -u postgres psql -c "\du"
        EOF
      # 6. Применяем миграции на сервер
    - name: Apply migrations on server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          cd ${{ secrets.DEPLOY_DIR }}
          poetry run python manage.py migrate
        EOF
    - name: Collect static files on server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          cd ${{ secrets.DEPLOY_DIR }}
          poetry run python manage.py collectstatic --noinput
        EOF
    - name: Restart application
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          sudo systemctl restart myapp.service
        EOF
